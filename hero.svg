<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title desc">
  <title id="title">Roronoa_Zoro — full-stack and machine-learning developer</title>
  <desc id="desc">A neon banner with three abstract blades, drifting particles, and a moving green highlight. Foodie and SpikeSight AI are the featured projects.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#10221d"/></linearGradient>
    <linearGradient id="blade" x2="0" y2="1"><stop stop-color="#eaffd1"/><stop offset=".5" stop-color="#a3e635"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a3e635"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#31534d" stroke-width=".6" opacity=".35"/></pattern>
    <clipPath id="frame"><rect width="1100" height="270" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1100" height="270" fill="url(#bg)"/>
    <rect width="1100" height="270" fill="url(#grid)"/>
    <circle cx="952" cy="111" r="125" fill="#a3e635" opacity=".045"><animate attributeName="r" values="118;132;118" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="952" cy="111" r="101" fill="none" stroke="#a3e635" opacity=".17"/>
    <circle cx="952" cy="111" r="82" fill="none" stroke="#22d3ee" stroke-dasharray="4 12" opacity=".4"><animateTransform attributeName="transform" type="rotate" from="0 952 111" to="360 952 111" dur="45s" repeatCount="indefinite"/></circle>
    <g fill="#a3e635">
      <circle cx="720" cy="50" r="2"><animate attributeName="cy" values="50;32;50" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;.85;.25" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1034" cy="216" r="2"><animate attributeName="cy" values="216;198;216" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="806" cy="208" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <g stroke-linejoin="round">
      <g transform="translate(904 105) rotate(-28)">
        <path d="M-8 60V-67L0-92L8-67V60Z" fill="url(#blade)" opacity=".8"/>
        <path d="M0-83V56" stroke="#f1ffd9" stroke-width="1.5"/>
        <rect x="-23" y="59" width="46" height="7" rx="3" fill="#22d3ee"/>
        <rect x="-7" y="66" width="14" height="42" rx="4" fill="#1a3042" stroke="#22d3ee"/>
        <path d="M-6 74L6 82M-6 86L6 94M-6 98L6 106" stroke="#22d3ee" opacity=".6"/>
      </g>
      <g transform="translate(961 80) rotate(12)">
        <path d="M-8 60V-67L0-92L8-67V60Z" fill="url(#blade)"/>
        <path d="M0-83V56" stroke="#f1ffd9" stroke-width="1.5"/>
        <rect x="-23" y="59" width="46" height="7" rx="3" fill="#a3e635"/>
        <rect x="-7" y="66" width="14" height="42" rx="4" fill="#24351e" stroke="#a3e635"/>
        <path d="M-6 74L6 82M-6 86L6 94M-6 98L6 106" stroke="#a3e635" opacity=".6"/>
      </g>
      <g transform="translate(1008 121) rotate(47)">
        <path d="M-8 60V-67L0-92L8-67V60Z" fill="#a78bfa" opacity=".75"/>
        <path d="M0-83V56" stroke="#f4eaff" stroke-width="1.5"/>
        <rect x="-23" y="59" width="46" height="7" rx="3" fill="#a78bfa"/>
        <rect x="-7" y="66" width="14" height="42" rx="4" fill="#302743" stroke="#a78bfa"/>
        <path d="M-6 74L6 82M-6 86L6 94M-6 98L6 106" stroke="#a78bfa" opacity=".6"/>
      </g>
    </g>
    <g font-family="Segoe UI,Arial,sans-serif">
      <text x="48" y="48" fill="#a3e635" font-size="12" font-weight="600" letter-spacing="2.5">CODE. BUILD. ADD A LITTLE MOTION.</text>
      <text x="45" y="118" fill="#e6edf3" font-size="58" font-weight="800" letter-spacing="1">RORONOA_ZORO</text>
      <text x="48" y="162" fill="#a8c8c2" font-size="24">Full-stack development / Machine learning</text>
      <circle cx="54" cy="211" r="5" fill="#a3e635"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
      <text x="70" y="216" fill="#e6edf3" font-size="17">Foodie <tspan fill="#638078">/</tspan> SpikeSight AI</text>
    </g>
    <path d="M48 247H1052" stroke="#29453e" stroke-width="2"/>
    <path d="M48 247H1052" stroke="url(#accent)" stroke-width="2" stroke-dasharray="170 834"><animate attributeName="stroke-dashoffset" values="1004;0;-1004" dur="9s" repeatCount="indefinite"/></path>
  </g>
  <rect x=".5" y=".5" width="1099" height="269" rx="18" fill="none" stroke="#29453e"/>
</svg>
