<svg xmlns="http://www.w3.org/2000/svg" width="480" height="185" viewBox="0 0 480 185" role="img" aria-labelledby="title desc">
  <title id="title">SpikeSight AI — VALORANT analytics</title>
  <desc id="desc">A tactical analytics card with a faceted prediction core, moving data signals, an orbiting cyan light, and a pulsing holographic platform. Public upload coming soon.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09131e"/><stop offset="1" stop-color="#102936"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#23d8ef" stop-opacity=".16"/><stop offset="1" stop-color="#23d8ef" stop-opacity="0"/></radialGradient>
    <linearGradient id="left-face" x2="1" y2="1"><stop stop-color="#3c91aa"/><stop offset="1" stop-color="#16374c"/></linearGradient>
    <linearGradient id="right-face" x2="1" y2="1"><stop stop-color="#163043"/><stop offset="1" stop-color="#276f82"/></linearGradient>
    <linearGradient id="power-core" x2="0" y2="1"><stop stop-color="#dcffff"/><stop offset=".5" stop-color="#5dedf3"/><stop offset="1" stop-color="#1fa1d2"/></linearGradient>
    <linearGradient id="map-fill" x2="1" y2="1"><stop stop-color="#122b3c" stop-opacity=".75"/><stop offset="1" stop-color="#193044" stop-opacity=".2"/></linearGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.1"/></filter>
    <clipPath id="frame"><rect width="480" height="185" rx="16"/></clipPath>
  </defs>
