      <path d="M390 91C402 81 382 70 392 59S399 44 390 36"><animateTransform attributeName="transform" type="translate" values="0 6;0 -10" dur="3.1s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.6;0" keyTimes="0;.25;.65;1" dur="3.1s" begin="-1s" repeatCount="indefinite"/></path>
      <path d="M410 94C399 83 419 76 410 65S403 51 411 44"><animateTransform attributeName="transform" type="translate" values="0 6;0 -10" dur="3.1s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.6;0" keyTimes="0;.25;.65;1" dur="3.1s" begin="-2s" repeatCount="indefinite"/></path>
    </g>
    <g transform="translate(348 91)"><g><path d="M-5 1Q-4-10 6-8Q9 2-5 1Z" fill="#91b959"/><path d="M-4 1L4-6" stroke="#d6e9a2" stroke-width=".8"/><animateTransform attributeName="transform" type="translate" values="0 0;1 -4;0 0" dur="4.1s" repeatCount="indefinite"/></g></g>
