<svg xmlns="http://www.w3.org/2000/svg" width="480" height="175" viewBox="0 0 480 175" role="img" aria-labelledby="title desc">
  <title id="title">Foodie</title>
  <desc id="desc">Restaurant management project card with animated rising steam. Public upload coming soon.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#19150e"/><stop offset="1" stop-color="#29200f"/></linearGradient></defs>
  <rect x=".5" y=".5" width="479" height="174" rx="12" fill="url(#bg)" stroke="#65502c"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="24" y="30" fill="#efbd69" font-size="10" font-weight="700" letter-spacing="2">FULL-STACK / RESTAURANT TECH</text>
    <text x="21" y="82" fill="#fff5e6" font-size="43" font-weight="800">Foodie</text>
    <text x="24" y="108" fill="#cabcaa" font-size="15">From menu to delivery.</text>
