    <circle cx="398" cy="87" r="102" fill="url(#ambient)"><animate attributeName="opacity" values=".65;1;.65" dur="5s" repeatCount="indefinite"/></circle>
    <path d="M323 39C350 15 421 13 452 43M327 157C359 177 416 181 448 151" fill="none" stroke="#e2a354" stroke-opacity=".12"/>
    <g fill="#eab879"><circle cx="334" cy="73" r="1.5" opacity=".55"><animate attributeName="opacity" values=".15;.65;.15" dur="4s" repeatCount="indefinite"/></circle><circle cx="449" cy="91" r="1" opacity=".4"/><path d="M442 35V43M438 39H446" stroke="#f3c582" opacity=".5"/></g>
    <g font-family="Segoe UI,Arial,sans-serif">
      <text x="24" y="30" fill="#f1b862" font-size="9.4" font-weight="700" letter-spacing="1.65">FULL-STACK / RESTAURANT TECH</text>
      <text x="22" y="82" fill="#fff4e1" font-size="43" font-weight="800">Foodie</text>
      <text x="24" y="109" fill="#e2c5a1" font-size="14">From menu to delivery.</text>
      <rect x="24" y="137" width="211" height="25" rx="12.5" fill="#392715" stroke="#916533" stroke-opacity=".8"/>
      <circle cx="37" cy="149.5" r="3" fill="#ffc574"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle>
      <text x="48" y="153" fill="#ffd499" font-size="9" font-weight="700" letter-spacing=".75">PUBLIC UPLOAD COMING SOON</text>
    </g>
    <ellipse cx="390" cy="164" rx="57" ry="8" fill="#080605" opacity=".45"/>
    <ellipse cx="390" cy="157" rx="55" ry="10" fill="url(#plate)"/>
