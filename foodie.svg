    <path d="M340 111C342 138 359 157 390 157S438 138 440 111Z" fill="url(#ceramic)"/>
    <path d="M344 119C351 143 367 151 389 151" fill="none" stroke="#fff8eb" stroke-width="2.3" stroke-linecap="round" opacity=".55"/>
