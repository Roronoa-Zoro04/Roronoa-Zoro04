<svg xmlns="http://www.w3.org/2000/svg" width="480" height="185" viewBox="0 0 480 185" role="img" aria-labelledby="title desc">
  <title id="title">Foodie — restaurant management</title>
  <desc id="desc">A warm restaurant card with a glazed ceramic bowl, colorful ingredients, rising steam, and floating garnish. Public upload coming soon.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17120e"/><stop offset="1" stop-color="#302112"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#f7aa44" stop-opacity=".18"/><stop offset="1" stop-color="#f7aa44" stop-opacity="0"/></radialGradient>
    <linearGradient id="ceramic" x2=".9" y2="1"><stop stop-color="#fff5dd"/><stop offset=".48" stop-color="#efdbb5"/><stop offset="1" stop-color="#b88e57"/></linearGradient>
    <linearGradient id="soup" x2="0" y2="1"><stop stop-color="#ee9d37"/><stop offset="1" stop-color="#aa542b"/></linearGradient>
    <linearGradient id="plate" x2="0" y2="1"><stop stop-color="#e2bd81"/><stop offset="1" stop-color="#82623c"/></linearGradient>
    <linearGradient id="steam" x2="0" y2="1"><stop stop-color="#ffe0a5" stop-opacity="0"/><stop offset=".55" stop-color="#ffe0a5" stop-opacity=".9"/><stop offset="1" stop-color="#ffcf87" stop-opacity=".25"/></linearGradient>
    <clipPath id="frame"><rect width="480" height="185" rx="16"/></clipPath>
    <clipPath id="soup-surface"><ellipse cx="390" cy="111" rx="45" ry="11"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
